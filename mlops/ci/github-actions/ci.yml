name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr_intelligence_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  module-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [payroll_intelligence, mlops, deep_learning]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: ${{ matrix.module }}
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: python -m pytest tests/ -q

  model-validation:
    runs-on: ubuntu-latest
    needs: module-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MLOps dependencies
        working-directory: mlops
        run: pip install -r requirements.txt
      - name: Validate registered models
        working-directory: mlops
        run: python -m src.cli
