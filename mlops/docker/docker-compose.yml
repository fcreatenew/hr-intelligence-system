name: hr-intelligence

# Catatan: file ini berada di mlops/docker/, sehingga konteks build harus
# menunjuk ke root repository (dua level di atas) agar `COPY models/` dan
# `COPY mlops/...` pada Dockerfile dapat ditemukan.
services:
  hr-intelligence-api:
    build:
      context: ../..
      dockerfile: mlops/docker/hr-api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      HR_API_KEY: ${HR_API_KEY:-dev-secret}
      MODEL_VERSION: ${MODEL_VERSION:-v2_mitigated}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  mlops:
    build:
      context: ../..
      dockerfile: mlops/docker/api/Dockerfile
    image: hr-intelligence-mlops:latest
    ports:
      - "8200:8200"
    environment:
      HR_INTELLIGENCE_BASE_URL: http://hr-intelligence-api:8000
      HR_INTELLIGENCE_API_KEY: ${HR_API_KEY:-dev-secret}
    depends_on:
      hr-intelligence-api:
        condition: service_healthy

  # Penjadwal: drift monitor harian, retraining berbasis drift, gate validasi.
  # Memakai image MLOps yang sama agar artifact model & src identik.
  mlops-cron:
    build:
      context: ../..
      dockerfile: mlops/docker/cron/Dockerfile
    image: hr-intelligence-mlops-cron:latest
    environment:
      HR_INTELLIGENCE_BASE_URL: http://hr-intelligence-api:8000
      HR_INTELLIGENCE_API_KEY: ${HR_API_KEY:-dev-secret}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    depends_on:
      mlops:
        condition: service_started
