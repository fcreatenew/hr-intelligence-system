# Docker Compose untuk HR Intelligence System (stack inti).
#
# Menjalankan lima layanan yang saling terhubung:
#   hr-api (8000)   — HR Intelligence API (prediksi model)
#   payroll-api (8300) — Payroll Intelligence (analitik & skor anomali)
#   hr-app (8080)   — Laravel HRIS (attendance/leave/payroll)
#   dashboard (8081) — React dashboard
#   assistant (8100) — AI HR Assistant
#
# Nilai kredensial sengaja dibaca dari environment; jangan commit `.env` asli.
#   HR_API_KEY=<secret> docker compose up --build

services:
  hr-api:
    build:
      # Konteks root karena Dockerfile ikut menyalin requirements/base.txt.
      context: .
      dockerfile: hr_intelligence_api/Dockerfile
    environment:
      HR_API_KEY: ${HR_API_KEY:-}
      # Default v2_mitigated = versi turnover paling adil (sesuai kode).
      MODEL_VERSION: ${MODEL_VERSION:-v2_mitigated}
      # Artifact model diambil dari Hugging Face Hub (bukan volume lokal).
      HR_MODEL_REPO: ${HR_MODEL_REPO:-fcreatenew/hr-intelligence-models}
      HR_MODEL_REVISION: ${HR_MODEL_REVISION:-main}
      HR_MODEL_SOURCE: ${HR_MODEL_SOURCE:-hub}
      # Token read repo privat; kosongkan untuk repo publik.
      HF_TOKEN: ${HF_TOKEN:-}
      # Cache unduhan agar tidak mengunduh ulang tiap restart.
      HF_HOME: /data/hf-cache
    volumes:
      - hf-cache:/data/hf-cache
    ports:
      - "8000:8000"

  payroll-api:
    build:
      context: .
      dockerfile: payroll_intelligence/Dockerfile
    ports:
      - "8300:8300"
    volumes:
      - ./data:/data:ro

  hr-app:
    build:
      context: ./hr_application
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: sqlite
      HR_INTELLIGENCE_BASE_URL: http://hr-api:8000
      HR_INTELLIGENCE_API_KEY: ${HR_API_KEY:-}
      PAYROLL_INTELLIGENCE_BASE_URL: http://payroll-api:8300
    ports:
      - "8080:8080"
    depends_on:
      - hr-api
      - payroll-api

  dashboard:
    build:
      context: ./hr_dashboard
      dockerfile: Dockerfile
      args:
        # Mode `live` agar dashboard memanggil API lewat proxy nginx.
        VITE_DATA_MODE: live
    ports:
      - "8081:80"
    depends_on:
      - hr-api
      - payroll-api

  assistant:
    build:
      context: .
      dockerfile: ai_hr_assistant/Dockerfile
    environment:
      HR_INTELLIGENCE_BASE_URL: http://hr-api:8000
      HR_INTELLIGENCE_API_KEY: ${HR_API_KEY:-}
    ports:
      - "8100:8100"
    depends_on:
      - hr-api

volumes:
  # Cache artifact model yang diunduh dari Hugging Face Hub.
  hf-cache:
