name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  hr-intelligence-api:
    name: hr_intelligence_api (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr_intelligence_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hr_intelligence_api/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "pytest>=8.0"
      - name: Run tests
        run: python -m pytest tests/ -q

  python-modules:
    name: ${{ matrix.module }} (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [payroll_intelligence, mlops, deep_learning, ai_hr_assistant]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.module }}/requirements.txt
      - name: Install dependencies
        working-directory: ${{ matrix.module }}
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: python -m pytest tests/ -q

  model-validation:
    name: mlops model gate
    runs-on: ubuntu-latest
    needs: python-modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: mlops/requirements.txt
      - name: Install MLOps dependencies
        working-directory: mlops
        run: pip install -r requirements.txt
      - name: Validate registered models
        working-directory: mlops
        run: python -m src.cli
      - name: Train turnover (reproducible) and validate
        working-directory: mlops
        run: python -m src.train --version v_ci --seed 42

  hr-application:
    name: hr_application (php artisan test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr_application
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath
          coverage: none
      - name: Copy environment file
        run: cp .env.example .env
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Generate application key
        run: php artisan key:generate
      - name: Run tests
        run: php artisan test

  hr-dashboard:
    name: hr_dashboard (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr_dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hr_dashboard/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
