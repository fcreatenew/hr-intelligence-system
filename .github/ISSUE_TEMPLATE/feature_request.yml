name: Feature request
description: Suggest an improvement or capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and expected outcome. Do not include real employee data, credentials, tokens, or confidential information.
  - type: input
    id: component
    attributes:
      label: Related component
      placeholder: hr_application
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user or engineering problem does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected user-visible behavior and alternatives.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes that can be verified by a maintainer.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] Tests cover success and failure cases.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and considerations
      description: Consider privacy, security, fairness, accessibility, maintenance, and backward compatibility.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and the roadmap.
          required: true
        - label: I removed personal, confidential, and secret information.
          required: true
