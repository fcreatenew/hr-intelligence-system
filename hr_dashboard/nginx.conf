# Konfigurasi nginx untuk image produksi hr_dashboard.
#
# Dashboard mode `live` memanggil `/api` dan `/payroll-api` (lihat
# src/services/api.js). Di dev proxy ditangani Vite; di container diteruskan
# nginx ke service backend. Nama host `hr-api` & `payroll-api` mengikuti
# docker-compose.yml.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HR Intelligence API (prediksi model ML).
    location /api/ {
        proxy_pass http://hr-api:8000/;
        proxy_set_header Host $host;
    }

    # Payroll Intelligence API (analitik payroll).
    location /payroll-api/ {
        proxy_pass http://payroll-api:8300/;
        proxy_set_header Host $host;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
